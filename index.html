function simplePage(key){const titles={projects:'Projects & Acquisition Portfolio',gis:'GIS Land Management',workflow:'Acquisition Workflow',parcels:'Land Parcels',compensation:'Compensation Management',rr:'Rehabilitation & Resettlement',ai:'AI Decision Support Center',field:'Field Verification',audit:'Audit Log',citizen:'Citizen / Landowner Status Portal'};let body='';if(key==='projects')body=`<div class="kpis"><div class="kpi"><div class="label">Active projects</div><strong>32</strong></div><div class="kpi"><div class="label">Delayed projects</div><strong style="color:var(--red)">6</strong></div><div class="kpi"><div class="label">Total estimated cost</div><strong>₹46,782 Cr</strong></div></div>`;else if(key==='ai')body=`<div class="grid"><div class="card"><div class="card-head"><div><h2>NH-48 Expansion — Bengaluru Region</h2><div class="card-sub">AI Prototype Estimate · Updated moments ago</div></div><span class="pill high">HIGH RISK</span></div><div style="padding:10px 18px 22px"><div style="font-size:46px;font-weight:800;color:var(--red)">86<span style="font-size:15px;color:var(--muted)"> / 100</span></div><p class="card-sub">Acquisition Risk Score</p><hr style="border:0;border-top:1px solid var(--line)"><p><b>Primary Bottleneck: Compensation</b></p><p class="card-sub">Compensation processing (52%) is significantly behind upstream workflow stages and is affecting possession progress.</p><div class="mini-grid"><div>Predicted delay<strong>3.8 months</strong></div><div>Model confidence<strong>78%</strong></div><div>Disputed parcels<strong>18</strong></div><div>R&amp;R completion<strong>41%</strong></div></div></div></div><div class="card"><div class="card-head"><div><h2>Explainable recommendations</h2><div class="card-sub">Rule-based prototype actions</div></div></div><div class="tasks"><div class="task"><b>1. Prioritize 24 pending compensation cases</b><span>Potentially unlocks 18% of corridor area.</span></div><div class="task"><b>2. Escalate approvals overdue by 30+ days</b><span>District compensation approval is 12 days overdue.</span></div><div class="task"><b>3. Review R&amp;R cases below milestone target</b><span>41% complete versus 62% planned.</span></div></div></div></div>`;else if(key==='field')body=`<div class="card" style="max-width:700px;padding:18px"><h2>Assigned Parcel: KA-BLR-001245</h2><p class="card-sub">NH-48 Expansion · Survey no. 118/4A · Bengaluru Urban</p><div class="form-grid" style="margin-top:18px"><label>GPS Coordinates<input value="12.9716, 77.5946" readonly></label><label>Land Category<input value="Agricultural" readonly></label><label>Verification status<select><option>Verified on site</option><option>Needs clarification</option></select></label><label>Remarks<input placeholder="Add field observation"></label></div><div class="modal-actions"><button class="secondary" onclick="notify('Location captured successfully')">◎ Capture location</button><button class="primary" onclick="notify('Field verification submitted; audit entry created')">Submit verification</button></div></div>`;else if(key==='citizen')body=`<div class="card" style="max-width:700px;padding:22px"><h2>Check acquisition status</h2><p class="card-sub">Use a Parcel ID or Application ID. Personal information is not displayed.</p><div style="display:flex;gap:8px;margin:18px 0"><input id="lookup" placeholder="e.g. KA-BLR-001245" style="flex:1;border:1px solid var(--line);border-radius:5px;padding:10px"><button class="primary" onclick="lookup()">Search status</button></div><div id="lookupresult" class="hidden" style="background:#f4f8fb;padding:15px;border-left:3px solid var(--blue)"><b>KA-BLR-001245 · NH-48 Expansion</b><p class="card-sub">Notification issued · Award declared · Compensation pending · R&amp;R in progress · Possession pending</p><button class="secondary" onclick="notify('Grievance form opened securely')">Submit grievance</button></div></div>`;else if(key==='workflow')body=workflow();else if(key==='compensation')body=compensation();else if(key==='audit')body=audit();else body=parcelTable(key);return `<div class="title-row"><div><h1>${titles[key]}</h1><p>${key==='ai'?'Transparent, explainable insights derived from synthetic portfolio data.':'Operational records and actions update the shared command center in real time.'}</p></div>${key==='projects'?'<button class="primary" onclick="openProject()">+ Create project</button>':''}</div>${body}`}
function parcelTable(key){return `<div class="card"><div class="card-head"><div><h2>${key==='gis'?'Interactive parcel intelligence':'Parcel register'}</h2><div class="card-sub">Search, filter and select a parcel to view lifecycle details</div></div><select class="filter"><option>All statuses</option><option>Compensation Pending</option><option>Acquired</option></select></div><div class="table-wrap"><table><thead><tr><th>Parcel ID</th><th>Project</th><th>District</th><th>Area</th><th>Acquisition status</th><th>Risk</th><th></th></tr></thead><tbody>${D.parcels.map((p,i)=>`<tr><td><b>${p[0]}</b><br><small>Survey 118/${i+1}A</small></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]} ha</td><td><span class="pill ${p[4]==='Acquired'?'low':p[5]==='High'?'high':'medium'}">${p[4]}</span></td><td>${p[5]}</td><td><button class="link" onclick="parcel('${p[0]}')">Details →</button></td></tr>`).join('')}</tbody></table></div></div>`}
function workflow(){let stages=['Project Proposal','Digital Scrutiny','Land Survey','Notification','Award Declaration','Compensation','R&R','Possession'];return `<div class="card"><div class="card-head"><div><h2>NH-48 Expansion — Bengaluru Region</h2><div class="card-sub">Current stage: Compensation disbursement</div></div><button class="primary" onclick="advance()">Mark compensation paid</button></div><div style="padding:21px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px">${stages.map((s,i)=>`<div style="text-align:center;font-size:10px;color:${i<5?'var(--green)':i===5?'var(--blue)':'var(--muted)'}"><div style="height:12px;border-radius:8px;background:${i<5?'var(--green)':i===5?'var(--blue)':'#dfe7ed'};margin:0 0 7px"></div>${s}</div>`).join('')}</div></div><div class="card wide"><div class="card-head"><div><h2>Workflow actions</h2><div class="card-sub">Role-routed tasks and approvals</div></div></div><div class="tasks"><div class="task"><span class="late">12 days overdue</span><b>Compensation approval batch 14</b><span>Responsible: District Authority · 24 parcels</span></div><div class="task"><b>R&R eligibility review</b><span>Responsible: Land Acquisition Officer · due 16 Sep 2026</span></div></div></div>`}
function compensation(){return `<div class="kpis"><div class="kpi"><div class="label">Total assessed</div><strong>₹2,476 Cr</strong></div><div class="kpi"><div class="label">Approved</div><strong>₹2,405 Cr</strong></div><div class="kpi"><div class="label">Paid</div><strong>${money(D.paid)}</strong></div><div class="kpi"><div class="label">Pending</div><strong style="color:var(--amber)">${money(D.pending)}</strong></div></div><div class="card wide"><div class="card-head"><div><h2>Compensation disbursement register</h2><div class="card-sub">Payments update parcels, project completion, notifications and audit logs</div></div></div><div class="table-wrap"><table><thead><tr><th>Parcel</th><th>Approved</th><th>Paid</th><th>Status</th><th>Action</th></tr></thead><tbody><tr><td><b>KA-BLR-001245</b></td><td>₹1.24 Cr</td><td>₹0.00 Cr</td><td><span class="pill high">Pending</span></td><td><button class="primary" onclick="pay()">Record payment</button></td></tr><tr><td><b>MH-NGP-004821</b></td><td>₹0.82 Cr</td><td>₹0.82 Cr</td><td><span class="pill low">Paid</span></td><td>—</td></tr></tbody></table></div></div>`}
function audit(){return `<div class="card"><div class="card-head"><div><h2>System Audit Trail</h2><div class="card-sub">Every material action is retained for governance and accountability</div></div><input class="filter" placeholder="Search audit log"></div><div class="table-wrap"><table><thead><tr><th>Timestamp</th><th>User / Role</th><th>Action</th><th>Record</th><th>Module</th></tr></thead><tbody id="auditrows"><tr><td>07 Sep 2026, 14:32</td><td><b>District Officer</b></td><td>Updated compensation status: Pending → Paid</td><td>KA-BLR-001245</td><td>Compensation</td></tr><tr><td>07 Sep 2026, 13:58</td><td><b>Shreya Anand</b></td><td>Viewed risk assessment</td><td>NH-48 Expansion</td><td>AI Decision Support</td></tr><tr><td>06 Sep 2026, 16:14</td><td><b>Field Officer</b></td><td>Verified GPS coordinates</td><td>KA-BLR-001245</td><td>Field Verification</td></tr></tbody></table></div></div>`}
function showPage(k,el){document.getElementById('crumb').textContent=' / '+(k==='dashboard'?'Command Center':el?.innerText||k);document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');document.getElementById('content').innerHTML=k==='dashboard'?dashboard():simplePage(k)}
function openProject(){document.getElementById('modal').className='modal-wrap';document.getElementById('modal').innerHTML=`<div class="modal"><h2>Create project proposal</h2><p>New proposal will route to the District Authority for digital scrutiny.</p><div class="form-grid"><label>Project name<input id="pname" value="Bengaluru Peripheral Link"></label><label>Project type<select><option>Highway</option><option>Railway</option><option>Renewable Energy</option></select></label><label>State<select><option>Karnataka</option><option>Maharashtra</option></select></label><label>Required land (ha)<input value="124"></label></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="createProject()">Submit proposal</button></div></div>`}
function closeModal(){document.getElementById('modal').className='hidden'}function createProject(){D.projects++;closeModal();showPage('dashboard');notify('Project proposal submitted and routed to District Authority')}
function pay(){D.paid+=1.24;D.pending-=1.24;D.acquired+=2.4;showPage('compensation');notify('Payment recorded — parcel, KPI, risk score and audit trail updated')}
function advance(){D.progress=Math.min(100,D.progress+1);notify('Compensation milestone completed. Notifications and audit event generated.')}
function parcel(id){document.getElementById('modal').className='modal-wrap';document.getElementById('modal').innerHTML=`<div class="modal"><h2>${id}</h2><p>NH-48 Expansion · Bengaluru Urban · Survey 118/4A</p><div class="mini-grid"><div>Area<strong>2.40 ha</strong></div><div>Risk score<strong style="color:var(--red)">86 / Critical</strong></div><div>Compensation<strong>Pending</strong></div><div>R&amp;R<strong>In progress</strong></div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><b style="font-size:12px">Lifecycle</b><p class="card-sub">✓ Proposal &nbsp; ✓ Survey &nbsp; ✓ Notification &nbsp; ✓ Award &nbsp; ◉ Compensation &nbsp; ○ R&amp;R &nbsp; ○ Possession</p><div class="modal-actions"><button class="primary" onclick="closeModal();showPage('workflow')">View workflow</button></div></div>`}
function lookup(){document.getElementById('lookupresult').className=''}function notify(x){let t=document.getElementById('toast');t.textContent='✓ '+x;t.className='toast';setTimeout(()=>t.className='toast hidden',3600)}showPage('dashboard');
</script></body></html>
